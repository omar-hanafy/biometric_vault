name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Validate release lane
        env:
          TARGET_LANE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'
          if [[ "$TARGET_LANE" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$TARGET_LANE" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a -dev.N prerelease, got $version."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: cd example && flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Validate agent plugin
        run: dart tool/validate_agent_plugin.dart

      - name: Test package
        run: flutter test

      - name: Test browser storage
        run: flutter test --platform chrome test/web_storage_test.dart

      - name: Test example
        run: cd example && flutter test

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.19

      - name: Install webp tools (pana screenshot checks need them)
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Run pana (full score required)
        run: pana --exit-code-threshold 0 .

  test-minimum:
    name: Test minimum SDK and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub downgrade --no-example
      - run: flutter analyze lib test
      - run: flutter test

  build-example:
    name: Build example (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
            command: flutter build appbundle && cd android && ./gradlew :biometric_vault:testDebugUnitTest
            java: true
          - name: ios
            os: macos-latest
            command: flutter build ios --no-codesign
          - name: macos
            os: macos-latest
            command: >-
              flutter build macos && cd macos &&
              xcodebuild test -workspace Runner.xcworkspace -scheme Runner
              -destination 'platform=macOS' -only-testing:RunnerTests
          - name: linux
            os: ubuntu-latest
            command: >-
              flutter build linux &&
              cmake -S linux -B build/linux/x64/release -DBIOMETRIC_VAULT_BUILD_TESTS=ON &&
              cmake --build build/linux/x64/release --target biometric_vault_linux_tests &&
              build/linux/x64/release/biometric_vault_tests/biometric_vault_linux_tests
            enable_desktop: linux
            linux_packages: true
          - name: web
            os: ubuntu-latest
            command: flutter build web
          - name: windows
            os: windows-latest
            command: flutter build windows

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Java
        if: matrix.java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build dependencies
        if: matrix.linux_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev cmake pkg-config

      - name: Enable desktop support
        if: matrix.enable_desktop != ''
        run: flutter config --enable-${{ matrix.enable_desktop }}-desktop

      - name: Install example dependencies
        run: cd example && flutter pub get

      - name: Build example
        run: cd example && ${{ matrix.command }}

      - name: Test iOS native implementation
        if: matrix.name == 'ios'
        working-directory: example/ios
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime, values in devices.items()
                     if "iOS" in runtime for device in values
                     if "iPhone" in device["name"]))')
          test_status=0
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$simulator" \
            -only-testing:RunnerTests -resultBundlePath ../build/ios-native-tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- || test_status=$?
          if [[ "$test_status" -ne 0 && -d ../build/ios-native-tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary \
              --path ../build/ios-native-tests.xcresult || printf 'Unable to read test summary\n'
            xcrun xcresulttool get test-results test-details \
              --path ../build/ios-native-tests.xcresult \
              --test-id 'RunnerTests/testEndToEndRoundTripAgainstRealKeychain()' \
              || printf 'Unable to read Keychain test details\n'
          fi
          exit "$test_status"
